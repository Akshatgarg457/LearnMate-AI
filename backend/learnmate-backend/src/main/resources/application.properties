spring.application.name=learnmate-backend

# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── Datasource (MySQL) ───────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learnmate?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:learnmate_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
# Entities are returned directly by the controllers, so lazy relations must resolve while the response is written.
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:CHANGE_ME_USE_A_256_BIT_SECRET_IN_PRODUCTION_ENVIRONMENT}
app.jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}
app.jwt.refresh-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── File upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
app.storage.upload-dir=${UPLOAD_DIR:./uploads}

# ── AI Tutor provider ─────────────────────────────────────────────────────────
app.ai.provider=${AI_PROVIDER:gemini}
app.ai.api-key=${AI_API_KEY:NOT_CONFIGURED}
app.ai.model=${AI_MODEL:gemini-2.5-flash}
app.ai.max-tokens=${AI_MAX_TOKENS:1000}

# ── Code execution judge ─────────────────────────────────────────────────────
app.judge.base-url=${JUDGE_BASE_URL:NOT_CONFIGURED}
app.judge.api-key=${JUDGE_API_KEY:NOT_CONFIGURED}

# ── Code Studio ──────────────────────────────────────────────────────────────
# Loads the original problem catalogue on start. Set false if problems are managed manually.
app.code-studio.seed=${CODE_STUDIO_SEED:true}
app.code-studio.rate-limit-per-minute=${CODE_STUDIO_RATE_LIMIT_PER_MINUTE:10}
app.code-studio.rate-limit-per-hour=${CODE_STUDIO_RATE_LIMIT_PER_HOUR:60}
app.code-studio.max-code-length=${CODE_STUDIO_MAX_CODE_LENGTH:65535}

# ── Google Meet integration ───────────────────────────────────────────────────
# Leave client-id as NOT_CONFIGURED to keep the app usable without Google Meet.
app.google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:NOT_CONFIGURED}
app.google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:NOT_CONFIGURED}
app.google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
app.google.oauth.frontend-url=${GOOGLE_OAUTH_FRONTEND_URL:http://localhost:5173}
# Encrypts stored tokens (AES-GCM). Generate with: openssl rand -hex 32
app.google.oauth.token-encryption-key=${GOOGLE_TOKEN_ENCRYPTION_KEY:}
app.google.oauth.authorize-url=https://accounts.google.com/o/oauth2/v2/auth
app.google.oauth.token-url=https://oauth2.googleapis.com/token
app.google.oauth.meet-spaces-url=https://meet.googleapis.com/v2/spaces
app.google.oauth.scope=https://www.googleapis.com/auth/meetings.space.created
app.google.oauth.state-ttl-seconds=${GOOGLE_OAUTH_STATE_TTL_SECONDS:600}

# ── Reward policy ─────────────────────────────────────────────────────────────
app.reward.points-per-teaching-minute=${REWARD_POINTS_PER_MINUTE:10}
app.reward.min-session-minutes=${REWARD_MIN_SESSION_MINUTES:5}
app.reward.max-rewardable-minutes=${REWARD_MAX_REWARDABLE_MINUTES:120}

# ── Error handling ───────────────────────────────────────────────────────────
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
