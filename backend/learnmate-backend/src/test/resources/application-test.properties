# H2 in-memory database for unit/integration tests
spring.datasource.url=jdbc:h2:mem:learnmate_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable MySQL-specific features in tests
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=test-secret-key-at-least-256-bits-long-for-unit-testing-purposes-only
app.jwt.expiry-ms=3600000
app.jwt.refresh-expiry-ms=7200000

app.cors.allowed-origins=http://localhost:5173

app.ai.api-key=NOT_CONFIGURED
app.judge.base-url=NOT_CONFIGURED
app.judge.api-key=NOT_CONFIGURED
app.code-studio.seed=false

app.google.oauth.client-id=NOT_CONFIGURED
app.google.oauth.client-secret=NOT_CONFIGURED
app.google.oauth.redirect-uri=http://localhost:8080/api/v1/auth/google/callback
app.google.oauth.frontend-url=http://localhost:5173
app.google.oauth.token-encryption-key=test-only-token-encryption-key
app.google.oauth.authorize-url=https://accounts.google.com/o/oauth2/v2/auth
app.google.oauth.token-url=https://oauth2.googleapis.com/token
app.google.oauth.meet-spaces-url=https://meet.googleapis.com/v2/spaces
app.google.oauth.scope=https://www.googleapis.com/auth/meetings.space.created
app.google.oauth.state-ttl-seconds=600

app.reward.points-per-teaching-minute=10
app.reward.min-session-minutes=5
app.reward.max-rewardable-minutes=120
