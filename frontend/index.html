<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LearnMate AI is a student-first learning platform bringing AI tutoring, peer help, study notes, community questions, and quizzes together."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#101014" />
    <script>
      /* Apply the saved (or system) theme before first paint so there is no flash. */
      (function () {
        try {
          var t = localStorage.getItem('lm.theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <title>LearnMate AI — Learn better, together</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
